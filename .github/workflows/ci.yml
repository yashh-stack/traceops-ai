name: TraceOps AI Security & Quality Gate

on:
  push:
    branches: ["main", "hardening/*"]
  pull_request:
    branches: ["main"]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install runtime & security dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,dashboard]"

      - name: Ruff SAST & Lint (S,B,E,F)
        run: ruff check traceops tests --select S,B,E,F

      - name: Mypy Static Type Check
        run: mypy traceops

      - name: Bandit Security Scan
        run: bandit -r traceops -ll

      - name: Dependency Supply-Chain Audit
        run: pip-audit -r requirements.txt

      - name: Adversarial Pytest Suite & Latency Regression Gate (p95 < 15.0 ms)
        run: |
          pytest -v
          python scripts/run_benchmark.py
          python -c "import json, sys; d=json.load(open('benchmark_report.json')); p95=d.get('p95_ms', 999); print(f'p95={p95} ms'); sys.exit(0 if p95 < 15.0 else 1)"
