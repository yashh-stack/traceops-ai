[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "traceops-ai"
version = "0.2.0"
description = "Deterministic Agent Circuit-Breaker & Runtime Evals Engine"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [
    { name = "TraceOps AI Team" }
]
dependencies = [
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "langgraph>=1.2.0",
    "google-genai>=3.6.0",
    "opentelemetry-api>=1.45.0",
    "opentelemetry-sdk>=1.45.0",
    "numpy>=1.26.0",
    "python-dotenv>=1.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.28.0",
    "ruff>=0.9.0",
    "mypy>=1.15.0",
    "bandit>=1.8.0",
    "pip-audit>=2.8.0"
]
dashboard = [
    "streamlit>=1.35.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-p no:langsmith_plugin"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "B", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
"traceops/state_machine.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true

[tool.setuptools.packages.find]
where = ["."]
include = ["traceops*"]
